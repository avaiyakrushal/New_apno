name: Build MB Diamond Diary v3.2.20
on:
  push:
    branches: [mb-diamond-diary-v3.2.20-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        run: |
          cat mb-build/part*.txt | base64 -d > mb-source.zip
          mkdir -p project
          unzip -q mb-source.zip -d project

      - name: Apply all finalized fixes
        run: |
          python3 mb-build/apply3218.py project
          python3 mb-build/apply3219.py project
          python3 mb-build/apply3220.py project
          node --check project/app/src/main/assets/app.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('project/app/src/main/assets/app.html').read_text()
          ids=set(re.findall(r'id="([^"]+)"',html))
          broken=[]
          for x in re.findall(r"document\.getElementById\('([^']+)'\)\.onclick",html):
              if x not in ids: broken.append(x)
          assert not broken, f"unguarded missing onclick IDs: {broken}"
          for required in [
              "window.mbWorkerProfile",
              "window.mbNotifications",
              "document.querySelectorAll('[data-screen]').forEach",
              "diamondDeleteNow",
              "hourDeleteNow",
              "expenseEntryList",
              "તારીખ:",
              "સમય:"
          ]:
              assert required in html or required in Path('project/app/src/main/assets/app.js').read_text(), required
          print('UI smoke checks passed')
          PY
          grep -q "versionName '3.2.20'" project/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle -p project :app:assembleRelease --stacktrace

      - name: Align APK and package source
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -P 16 -f -v 4             project/app/build/outputs/apk/release/app-release-unsigned.apk             MB-Diamond-Diary-v3.2.20-aligned-unsigned.apk
          "$BT/zipalign" -c -P 16 -v 4 MB-Diamond-Diary-v3.2.20-aligned-unsigned.apk
          (cd project && zip -qr ../MB-Diamond-Diary-v3.2.20-source.zip .)
          mkdir -p android-sign-tools/lib
          cp "$BT/apksigner" android-sign-tools/
          cp "$BT/lib/apksigner.jar" android-sign-tools/lib/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v3.2.20-build
          path: |
            MB-Diamond-Diary-v3.2.20-aligned-unsigned.apk
            MB-Diamond-Diary-v3.2.20-source.zip
            android-sign-tools
