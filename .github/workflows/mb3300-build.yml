name: Build MB Diamond Diary v3.3.0 Clean
on:
  push:
    branches: [mb-diamond-diary-v3.3.0-clean]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct stable v3.2.29 source
        run: |
          cat mb-build/part*.txt | base64 -d > mb-source.zip
          mkdir -p project
          unzip -q mb-source.zip -d project
          python3 mb-build/apply3218.py project
          python3 mb-build/apply3219.py project
          python3 mb-build/apply3220.py project
          python3 mb-build/apply3221.py project
          python3 mb-build/apply3222.py project
          python3 mb-build/apply3223.py project
          python3 mb-build/apply3224.py project
          python3 mb-build/apply3225.py project
          python3 mb-build/apply3226.py project
          python3 mb-build/apply3227.py project
          python3 mb-build/apply3228.py project
          python3 mb-build/apply3229.py project

      - name: Apply clean v3.3.0 UID schema
        run: |
          python3 mb-build/apply3300.py project
          node --check project/app/src/main/assets/app.js

      - name: Regression checks
        run: |
          set -e
          M=project/app/src/main/java/com/example/diamonddiary/MainActivity.java
          G=project/app/build.gradle
          grep -q "versionName '3.3.0'" "$G"
          grep -q "versionCode 100" "$G"
          grep -q 'schemaVersion", "3.3"' "$M"
          grep -q 'authUid' "$M"
          grep -q 'ownerUid' "$M"
          grep -q 'commitWorkerMembershipBatch' "$M"
          grep -q 'bossEntryListeners' "$M"
          grep -q 'EVENTUAL_SYNC_INTERVAL_MS' "$M"
          test -f firebase/firestore.rules
          echo "v3.3.0 clean schema regression checks passed"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        run: gradle -p project --no-daemon --max-workers=1 :app:assembleRelease --stacktrace

      - name: Align APK and package source
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -P 16 -f -v 4             project/app/build/outputs/apk/release/app-release-unsigned.apk             MB-Diamond-Diary-v3.3.0-aligned-unsigned.apk
          "$BT/zipalign" -c -P 16 -v 4 MB-Diamond-Diary-v3.3.0-aligned-unsigned.apk
          (cd project && zip -qr ../MB-Diamond-Diary-v3.3.0-source.zip .)

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v3.3.0-clean-build
          path: |
            MB-Diamond-Diary-v3.3.0-aligned-unsigned.apk
            MB-Diamond-Diary-v3.3.0-source.zip
            firebase/firestore.rules
