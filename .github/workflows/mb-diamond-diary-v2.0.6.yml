name: Build MB Diamond Diary v2.0.6 APK

on:
  push:
    branches: [mb-diamond-diary-v2.0.6-build]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble MainActivity source
        run: |
          cat MB-Diamond-Diary-v2.0.6/app/src/main/java/com/example/diamonddiary/MainActivity.java.part1 \
              MB-Diamond-Diary-v2.0.6/app/src/main/java/com/example/diamonddiary/MainActivity.java.part2 \
              MB-Diamond-Diary-v2.0.6/app/src/main/java/com/example/diamonddiary/MainActivity.java.part3 \
              MB-Diamond-Diary-v2.0.6/app/src/main/java/com/example/diamonddiary/MainActivity.java.part4 \
              > MB-Diamond-Diary-v2.0.6/app/src/main/java/com/example/diamonddiary/MainActivity.java
      - name: Build debug APK
        working-directory: MB-Diamond-Diary-v2.0.6
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v2.0.6-debug-APK
          path: MB-Diamond-Diary-v2.0.6/app/build/outputs/apk/debug/app-debug.apk
