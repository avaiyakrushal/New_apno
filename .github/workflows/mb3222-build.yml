name: Build MB Diamond Diary v3.2.22
on:
  push:
    branches: [mb-diamond-diary-v3.2.22-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        run: |
          cat mb-build/part*.txt | base64 -d > mb-source.zip
          mkdir -p project
          unzip -q mb-source.zip -d project

      - name: Apply complete finalized patch chain
        run: |
          python3 mb-build/apply3218.py project
          python3 mb-build/apply3219.py project
          python3 mb-build/apply3220.py project
          python3 mb-build/apply3221.py project
          python3 mb-build/apply3222.py project
          node --check project/app/src/main/assets/app.js

      - name: Regression checks
        run: |
          set -e
          HTML=project/app/src/main/assets/app.html
          JS=project/app/src/main/assets/app.js
          JAVA=project/app/src/main/java/com/example/diamonddiary/MainActivity.java

          grep -q "versionName '3.2.22'" project/app/build.gradle

          # Navigation and entry delete coverage
          grep -q 'data-screen="diamond"' "$HTML"
          grep -q 'data-screen="expense"' "$HTML"
          grep -q 'data-screen="reports"' "$HTML"
          grep -q 'diamondDeleteNow' "$HTML"
          grep -q 'hourDeleteNow' "$HTML"
          grep -q 'data-delete-expense' "$JS"

          # Worker dashboard/company identity
          grep -q 'workerCompanyName' "$HTML"
          grep -q 'workerCompanyCode' "$HTML"
          grep -q 'refreshBossWorkersCanonical' "$JAVA"

          # Notification delivery + timestamp + delete
          grep -q 'notificationUserListener' "$JAVA"
          grep -q 'latestNotice' "$JAVA"
          grep -q 'deleteNotificationFromWeb' "$JAVA"
          grep -q 'તારીખ:' "$HTML"
          grep -q 'સમય:' "$HTML"

          # Login must not depend on closing/reopening app
          grep -q 'continueAfterRoleSelection' "$JAVA"
          grep -q 'postDelayed(continueUi, 2500)' "$JAVA"
          grep -q 'postDelayed(continueUi, 3000)' "$JAVA"

          # No custom point button anywhere; decimal comes from phone keyboard
          ! grep -q 'hourValueDot' "$HTML"
          ! grep -q 'hourValueDot' "$JS"
          ! grep -q 'પોઇન્ટ' "$HTML"

          echo "All v3.2.22 regression checks passed"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle -p project :app:assembleRelease --stacktrace

      - name: Align APK and package source
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -P 16 -f -v 4             project/app/build/outputs/apk/release/app-release-unsigned.apk             MB-Diamond-Diary-v3.2.22-aligned-unsigned.apk
          "$BT/zipalign" -c -P 16 -v 4 MB-Diamond-Diary-v3.2.22-aligned-unsigned.apk
          (cd project && zip -qr ../MB-Diamond-Diary-v3.2.22-source.zip .)
          mkdir -p android-sign-tools/lib
          cp "$BT/apksigner" android-sign-tools/
          cp "$BT/lib/apksigner.jar" android-sign-tools/lib/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v3.2.22-build
          path: |
            MB-Diamond-Diary-v3.2.22-aligned-unsigned.apk
            MB-Diamond-Diary-v3.2.22-source.zip
            android-sign-tools
