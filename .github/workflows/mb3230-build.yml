name: Build MB Diamond Diary v3.2.30
on:
  push:
    branches: [mb-diamond-diary-v3.2.30-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct v3.2.29 source
        run: |
          cat mb-build/part*.txt | base64 -d > mb-source.zip
          mkdir -p project
          unzip -q mb-source.zip -d project
          python3 mb-build/apply3218.py project
          python3 mb-build/apply3219.py project
          python3 mb-build/apply3220.py project
          python3 mb-build/apply3221.py project
          python3 mb-build/apply3222.py project
          python3 mb-build/apply3223.py project
          python3 mb-build/apply3224.py project
          python3 mb-build/apply3225.py project
          python3 mb-build/apply3226.py project
          python3 mb-build/apply3227.py project
          python3 mb-build/apply3228.py project
          python3 mb-build/apply3229.py project

      - name: Apply v3.2.30 resume sync
        run: |
          python3 mb-build/apply3230.py project
          node --check project/app/src/main/assets/app.js

      - name: Regression checks
        run: |
          set -e
          M=project/app/src/main/java/com/example/diamonddiary/MainActivity.java
          G=project/app/build.gradle
          grep -q "versionName '3.2.30'" "$G"
          grep -q "versionCode 88" "$G"
          grep -q "EVENTUAL_SYNC_INTERVAL_MS" "$M"
          grep -q "30L \* 60L \* 1000L" "$M"
          grep -q "eventualSyncHandler.post(this::runEventualSyncNow)" "$M"
          grep -q "removeCallbacks(eventualSyncRunnable)" "$M"
          grep -q "Source.SERVER" "$M"
          grep -q "bossEntryListeners" "$M"
          grep -q "report-preview-month" project/app/src/main/assets/app.html
          echo "v3.2.30 sync regression checks passed"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle -p project :app:assembleRelease --stacktrace

      - name: Align APK and package source
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -P 16 -f -v 4             project/app/build/outputs/apk/release/app-release-unsigned.apk             MB-Diamond-Diary-v3.2.30-aligned-unsigned.apk
          "$BT/zipalign" -c -P 16 -v 4 MB-Diamond-Diary-v3.2.30-aligned-unsigned.apk
          (cd project && zip -qr ../MB-Diamond-Diary-v3.2.30-source.zip .)
          mkdir -p android-sign-tools/lib
          cp "$BT/apksigner" android-sign-tools/
          cp "$BT/lib/apksigner.jar" android-sign-tools/lib/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v3.2.30-build
          path: |
            MB-Diamond-Diary-v3.2.30-aligned-unsigned.apk
            MB-Diamond-Diary-v3.2.30-source.zip
            android-sign-tools
