name: Build MB Diamond Diary v3.2.17
on:
  push:
    branches: [mb-diamond-diary-v3.2.17-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        run: |
          cat mb-build/part*.txt | base64 -d > mb-source.zip
          mkdir -p project
          unzip -q mb-source.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APK
        run: gradle -p project :app:assembleRelease --stacktrace
      - name: Zipalign APK and package signing tools
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4             project/app/build/outputs/apk/release/app-release-unsigned.apk             project/app/build/outputs/apk/release/MB-Diamond-Diary-v3.2.17-aligned-unsigned.apk
          "$BT/zipalign" -c -p 4 project/app/build/outputs/apk/release/MB-Diamond-Diary-v3.2.17-aligned-unsigned.apk
          mkdir -p android-sign-tools/lib
          cp "$BT/apksigner" android-sign-tools/
          cp "$BT/zipalign" android-sign-tools/
          cp "$BT/lib/apksigner.jar" android-sign-tools/lib/
      - name: Upload aligned APK and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v3.2.17-aligned-and-tools
          path: |
            project/app/build/outputs/apk/release/MB-Diamond-Diary-v3.2.17-aligned-unsigned.apk
            android-sign-tools
