name: Build MB Diamond Diary v3.2.33
on:
  push:
    branches: [mb-diamond-diary-v3.2.33-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct stable v3.2.30 + Super Admin source
        run: |
          cat mb-build/part*.txt | base64 -d > mb-source.zip
          mkdir -p project
          unzip -q mb-source.zip -d project
          python3 mb-build/apply3218.py project
          python3 mb-build/apply3219.py project
          python3 mb-build/apply3220.py project
          python3 mb-build/apply3221.py project
          python3 mb-build/apply3222.py project
          python3 mb-build/apply3223.py project
          python3 mb-build/apply3224.py project
          python3 mb-build/apply3225.py project
          python3 mb-build/apply3226.py project
          python3 mb-build/apply3227.py project
          python3 mb-build/apply3228.py project
          python3 mb-build/apply3229.py project
          python3 mb-build/apply3230.py project
          python3 mb-build/apply3232.py project

      - name: Apply v3.2.33 Hira sync repair
        run: |
          python3 mb-build/apply3233.py project
          node --check project/app/src/main/assets/app.js

      - name: Regression checks
        run: |
          set -e
          M=project/app/src/main/java/com/example/diamonddiary/MainActivity.java
          G=project/app/build.gradle
          grep -q "versionName '3.2.33'" "$G"
          grep -q "versionCode 91" "$G"
          grep -q "hasWorkerMonthSummary" "$M"
          grep -q "publishWorkerSummaryUpdate" "$M"
          grep -q "refreshWorkerEntriesServerFallback" "$M"
          grep -q "Source.SERVER" "$M"
          grep -q "Super Admin Dashboard" "$M"
          grep -q "EVENTUAL_SYNC_INTERVAL_MS" "$M"
          grep -q "restoreWorkerMembershipAfterReinstall" "$M"
          grep -q "finishWorkerMembershipRestore" "$M"
          grep -q "Tasks.whenAll" "$M"
          echo "v3.2.33 sync regression checks passed"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        run: gradle -p project --no-daemon --max-workers=1 :app:assembleRelease --stacktrace

      - name: Align APK and package source
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -P 16 -f -v 4             project/app/build/outputs/apk/release/app-release-unsigned.apk             MB-Diamond-Diary-v3.2.33-aligned-unsigned.apk
          "$BT/zipalign" -c -P 16 -v 4 MB-Diamond-Diary-v3.2.33-aligned-unsigned.apk
          (cd project && zip -qr ../MB-Diamond-Diary-v3.2.33-source.zip .)
          mkdir -p android-sign-tools/lib
          cp "$BT/apksigner" android-sign-tools/
          cp "$BT/lib/apksigner.jar" android-sign-tools/lib/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v3.2.33-build
          path: |
            MB-Diamond-Diary-v3.2.33-aligned-unsigned.apk
            MB-Diamond-Diary-v3.2.33-source.zip
            android-sign-tools
