name: Diagnose MB Diamond Dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - mb-diamond-diary-v3.1-build
    paths:
      - '.github/workflows/mb-diamond-diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          cat mbparts/part-00 mbparts/part-01 mbparts/part-02 mbparts/part-03 mbparts/part-04 mbparts/part-05a mbparts/part-05b mbparts/part-05c > source.b64
          base64 -d source.b64 > source.zip
          mkdir mbbuild
          unzip -q source.zip -d mbbuild
      - name: Apply all current patches
        run: |
          python tools/mb_patch_v313.py mbbuild
          python tools/mb_patch_v316.py mbbuild
          python tools/mb_patch_v317.py mbbuild
      - name: Print dashboard data flow and rules
        run: |
          F=mbbuild/app/src/main/java/com/example/diamonddiary/MainActivity.java
          J=mbbuild/app/src/main/assets/app.js
          echo '=== ENTRY JSON / CLOUD SAVE ==='
          grep -nE 'entryFromJson|syncEntriesFromWeb|rebuildWorkerSummaryFromCloud|syncWorkerSummaryFromWeb|calculateMonthFromEntries|refreshBossDashboardFromEntries|watchPendingWorkers' "$F" || true
          sed -n '1450,1665p' "$F"
          echo '=== WORKER JOIN / SUMMARY ==='
          sed -n '1120,1365p' "$F"
          echo '=== JS ENTRY SHAPES ==='
          grep -nE "type.?[:=].?['\"]?(diamond|hour|withdrawal)|pieces|amount|hours|syncWorkerSummary|mbSync|save.*entry|diamondEntries|hourEntries" "$J" | head -n 500 || true
          echo '=== RULES / FIREBASE CONFIG FILES ==='
          find mbbuild -maxdepth 4 -type f | grep -Ei 'firestore|firebase|rules|json' | sort || true
          for R in $(find mbbuild -maxdepth 4 -type f | grep -Ei 'firestore.*rules|\.rules$'); do echo "=== $R ==="; cat "$R"; done
