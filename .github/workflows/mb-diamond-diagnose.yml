name: Diagnose MB Diamond Dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - mb-diamond-diary-v3.1-build
    paths:
      - '.github/workflows/mb-diamond-diagnose.yml'
      - 'tools/mb_patch_v313.py'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          cat mbparts/part-00 mbparts/part-01 mbparts/part-02 mbparts/part-03 mbparts/part-04 mbparts/part-05a mbparts/part-05b mbparts/part-05c > source.b64
          base64 -d source.b64 > source.zip
          mkdir mbbuild
          unzip -q source.zip -d mbbuild
      - name: Apply current patch
        run: python tools/mb_patch_v313.py mbbuild
      - name: Locate methods
        run: |
          F=mbbuild/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -nE 'grantRole|pushCloudEntries|watchCloud|cloudEntries|diaryEntries|pushEntries|loadEntries|setWorkerMode|roleChoice' "$F" || true
          echo '=== 1250-1490 ==='
          sed -n '1250,1490p' "$F"
          echo '=== 1710-2005 ==='
          sed -n '1710,2005p' "$F"
          echo '=== UI setup role-choice references ==='
          grep -nE 'roleChoice|bossChoice|workerChoice|saveRole\(' "$F" || true
