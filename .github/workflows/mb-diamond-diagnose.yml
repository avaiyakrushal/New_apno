name: Diagnose MB Diamond Dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - mb-diamond-diary-v3.1-build
    paths:
      - '.github/workflows/mb-diamond-diagnose.yml'
      - 'tools/mb_patch_v313.py'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          cat mbparts/part-00 mbparts/part-01 mbparts/part-02 mbparts/part-03 mbparts/part-04 mbparts/part-05a mbparts/part-05b mbparts/part-05c > source.b64
          base64 -d source.b64 > source.zip
          mkdir mbbuild
          unzip -q source.zip -d mbbuild
      - name: Apply current patch
        run: python tools/mb_patch_v313.py mbbuild
      - name: Print routing and cloud sync code
        run: |
          F=mbbuild/app/src/main/java/com/example/diamonddiary/MainActivity.java
          echo '=== ROLE / LOGIN 700-930 ==='
          sed -n '700,930p' "$F"
          echo '=== WORKER LISTENER 1120-1205 ==='
          sed -n '1120,1205p' "$F"
          echo '=== ENTRY SYNC 1570-1715 ==='
          sed -n '1570,1715p' "$F"
          echo '=== ROLE GRANT / SETUP 2065-2185 ==='
          sed -n '2065,2185p' "$F"
          echo '=== HTML/JS ROLE MARKERS ==='
          grep -nE 'role|boss|worker|hour|diamond|office|ઓફિસ|શેઠ|હીરા|grantRole|selectRole' mbbuild/app/src/main/assets/app.js mbbuild/app/src/main/assets/app.html | head -n 500 || true
