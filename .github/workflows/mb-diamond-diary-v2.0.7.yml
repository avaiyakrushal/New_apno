name: Build MB Diamond Diary v2.0.7 APK

on:
  push:
    branches: [mb-diamond-diary-v2.0.7-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Extract MB Diamond Diary source
        run: |
          rm -rf mbd-build
          mkdir mbd-build
          unzip -q mb-diamond-diary-v2.0.7-source.zip -d mbd-build

      - name: Enable AndroidX
        run: |
          touch mbd-build/gradle.properties
          grep -q '^android.useAndroidX=' mbd-build/gradle.properties \
            && sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' mbd-build/gradle.properties \
            || echo 'android.useAndroidX=true' >> mbd-build/gradle.properties
          grep -q '^android.enableJetifier=' mbd-build/gradle.properties \
            && sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' mbd-build/gradle.properties \
            || echo 'android.enableJetifier=true' >> mbd-build/gradle.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: mbd-build
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "## MB Diamond Diary build error" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -E -B 4 -A 16 "FAILURE:|What went wrong:|Execution failed for task|error:|Caused by:" build.log | tail -n 120 >> "$GITHUB_STEP_SUMMARY" || tail -n 120 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi

      - name: Upload MB Diamond Diary APK
        uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v2.0.7-debug
          path: mbd-build/app/build/outputs/apk/debug/app-debug.apk
