name: Build MB Diamond Diary v2.0.7 APK

on:
  push:
    branches: [mb-diamond-diary-v2.0.7-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extract MB Diamond Diary source
        run: |
          rm -rf mbd-build
          mkdir mbd-build
          unzip -q mb-diamond-diary-v2.0.7-source.zip -d mbd-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: mbd-build
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload MB Diamond Diary APK
        uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v2.0.7-debug
          path: mbd-build/app/build/outputs/apk/debug/app-debug.apk
