name: Build MB Diamond Diary v3.2.21
on:
  push:
    branches: [mb-diamond-diary-v3.2.21-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        run: |
          cat mb-build/part*.txt | base64 -d > mb-source.zip
          mkdir -p project
          unzip -q mb-source.zip -d project

      - name: Apply finalized patch chain
        run: |
          python3 mb-build/apply3218.py project
          python3 mb-build/apply3219.py project
          python3 mb-build/apply3220.py project
          python3 mb-build/apply3221.py project
          node --check project/app/src/main/assets/app.js
          grep -q "versionName '3.2.21'" project/app/build.gradle
          grep -q "registerWorkerPushToken" project/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -q "consumeWorkerLatestNotice" project/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -q "latestNotice" project/app/src/main/java/com/example/diamonddiary/MainActivity.java
          ! grep -q "hourRateDot" project/app/src/main/assets/app.html
          ! grep -q 'class="rate-dot"' project/app/src/main/assets/app.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle -p project :app:assembleRelease --stacktrace

      - name: Align APK and package source
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -P 16 -f -v 4             project/app/build/outputs/apk/release/app-release-unsigned.apk             MB-Diamond-Diary-v3.2.21-aligned-unsigned.apk
          "$BT/zipalign" -c -P 16 -v 4 MB-Diamond-Diary-v3.2.21-aligned-unsigned.apk
          (cd project && zip -qr ../MB-Diamond-Diary-v3.2.21-source.zip .)
          mkdir -p android-sign-tools/lib
          cp "$BT/apksigner" android-sign-tools/
          cp "$BT/lib/apksigner.jar" android-sign-tools/lib/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v3.2.21-build
          path: |
            MB-Diamond-Diary-v3.2.21-aligned-unsigned.apk
            MB-Diamond-Diary-v3.2.21-source.zip
            android-sign-tools
