name: Build MB Diamond Diary Final APK

on:
  push:
    branches:
      - mb-diamond-diary-v3.1-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable debug signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: .mb-signing/debug.keystore
          key: mb-diamond-diary-debug-signing-v1
      - name: Create stable debug signing key once
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .mb-signing
          keytool -genkeypair -v -keystore .mb-signing/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Restore source
        run: |
          cat mbparts/part-00 mbparts/part-01 mbparts/part-02 mbparts/part-03 mbparts/part-04 mbparts/part-05a mbparts/part-05b mbparts/part-05c > source.b64
          base64 -d source.b64 > source.zip
          mkdir mbbuild
          unzip -q source.zip -d mbbuild
      - name: Apply all current patches through v3.2.0
        run: |
          python tools/mb_patch_v313.py mbbuild
          python tools/mb_patch_v316.py mbbuild
          python tools/mb_patch_v317.py mbbuild
          python tools/mb_patch_v318.py mbbuild
          python tools/mb_patch_v319.py mbbuild
          python tools/mb_patch_v320.py mbbuild
      - name: Validate v3.2.0
        run: |
          grep -q "versionName '3.2.0'" mbbuild/app/build.gradle
          grep -q 'worker.put("active", true)' mbbuild/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -q 'હીરા કારીગર' mbbuild/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -q 'ઓફિસ / કલાક' mbbuild/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -q 'id="hourRateInput" type="text" inputmode="decimal"' mbbuild/app/src/main/assets/app.html
      - name: Increase Gradle build memory
        run: |
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.workers.max=1\n' >> mbbuild/gradle.properties
      - name: Build debug APK
        run: gradle -p mbbuild :app:assembleDebug --stacktrace --no-daemon --max-workers=1
      - name: Package APK
        run: cp mbbuild/app/build/outputs/apk/debug/app-debug.apk MB-Diamond-Diary-v3.2.0-final.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v3.2.0-final
          path: MB-Diamond-Diary-v3.2.0-final.apk
