name: Build MB Diamond Diary Final APK

on:
  push:
    branches:
      - mb-diamond-diary-v3.1-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable Firebase signing key
        uses: actions/cache@v4
        with:
          path: .mb-signing/debug.keystore
          key: mb-diamond-diary-debug-signing-v1
      - name: Require existing Firebase signing key
        run: |
          test -f .mb-signing/debug.keystore
          keytool -list -v -keystore .mb-signing/debug.keystore -storepass android -alias androiddebugkey | tee signing-key.txt
          grep -qi 'EE:51:44:E1:DC:33:C0:2C:F6:59:39:EC:78:94:8C:37:32:8A:1D:AF' signing-key.txt
      - name: Restore source
        run: |
          cat mbparts/part-00 mbparts/part-01 mbparts/part-02 mbparts/part-03 mbparts/part-04 mbparts/part-05a mbparts/part-05b mbparts/part-05c > source.b64
          base64 -d source.b64 > source.zip
          mkdir mbbuild
          unzip -q source.zip -d mbbuild
      - name: Apply patches through v3.2.8
        run: |
          python tools/mb_patch_v313.py mbbuild
          python tools/mb_patch_v316.py mbbuild
          python tools/mb_patch_v317.py mbbuild
          python tools/mb_patch_v318.py mbbuild
          python tools/mb_patch_v319.py mbbuild
          python tools/mb_patch_v320.py mbbuild
          python tools/mb_patch_v322.py mbbuild
          python tools/mb_patch_v323.py mbbuild
          python tools/mb_patch_v324.py mbbuild
          python tools/mb_patch_v325.py mbbuild
          python tools/mb_patch_v326.py mbbuild
          python tools/mb_patch_v327.py mbbuild
          python tools/mb_patch_v328.py mbbuild
          python tools/mb_patch_v329.py mbbuild
          python tools/mb_patch_v330.py mbbuild
      - name: Validate v3.2.8 self-healing membership
        run: |
          grep -q "versionName '3.2.8'" mbbuild/app/build.gradle
          grep -q 'mirrorWorkerMembership' mbbuild/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -q 'collection("members")' mbbuild/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -q 'loadBossWorkersFromUsers' mbbuild/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -q 'bossMembersListener' mbbuild/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -q 'watchWorkerNoticeSubcollections' mbbuild/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -q 'notificationFallbackListener' mbbuild/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -q 'final String sharedText = clean' mbbuild/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -q 'id="hourRateDot"' mbbuild/app/src/main/assets/app.html
          grep -q 'id="hourValueDot"' mbbuild/app/src/main/assets/app.html
          grep -q 'repairWorkerFromLocalMembership' mbbuild/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -q 'localMembershipWins' mbbuild/app/src/main/java/com/example/diamonddiary/MainActivity.java
      - name: Increase Gradle build memory
        run: |
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.workers.max=1\n' >> mbbuild/gradle.properties
      - name: Build APK
        run: gradle -p mbbuild :app:assembleDebug --stacktrace --no-daemon --max-workers=1
      - name: Re-sign and verify Firebase certificate
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" sign --ks .mb-signing/debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out MB-Diamond-Diary-v3.2.8-membership-self-heal.apk mbbuild/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose --print-certs MB-Diamond-Diary-v3.2.8-membership-self-heal.apk | tee apk-signing.txt
          grep -qi 'ee5144e1dc33c02cf65939ec78948c37328a1daf' apk-signing.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v3.2.8-membership-self-heal
          path: MB-Diamond-Diary-v3.2.8-membership-self-heal.apk
