name: Build MB Diamond Diary Final APK

on:
  push:
    branches:
      - mb-diamond-diary-v3.1-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: .mb-signing/debug.keystore
          key: mb-diamond-diary-debug-signing-v1

      - name: Create stable debug signing key once
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .mb-signing
          keytool -genkeypair -v \
            -keystore .mb-signing/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Show Firebase signing fingerprints
        run: |
          keytool -list -v \
            -keystore .mb-signing/debug.keystore \
            -storepass android \
            -alias androiddebugkey | grep -E 'SHA1:|SHA256:'

      - name: Restore source
        run: |
          cat mbparts/part-00 mbparts/part-01 mbparts/part-02 mbparts/part-03 mbparts/part-04 mbparts/part-05a mbparts/part-05b mbparts/part-05c > source.b64
          base64 -d source.b64 > source.zip
          mkdir mbbuild
          unzip -q source.zip -d mbbuild

      - name: Apply v3.1.3 dashboard + decimal parsing fixes
        run: python tools/mb_patch_v313.py mbbuild

      - name: Apply v3.1.6 login + live totals fixes
        run: python tools/mb_patch_v316.py mbbuild

      - name: Apply v3.1.7 explicit point controls
        run: python tools/mb_patch_v317.py mbbuild

      - name: Validate v3.1.7 source
        run: |
          grep -q "versionName '3.1.7'" mbbuild/app/build.gradle
          grep -q 'secondaryButton("ઓફિસ (કલાકનું કામ)")' mbbuild/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -q 'secondaryButton("હીરા (કારીગર)")' mbbuild/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -q 'refreshBossDashboardFromEntries' mbbuild/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -q 'id="hourRateDot"' mbbuild/app/src/main/assets/app.html
          grep -q 'class="rate-dot"' mbbuild/app/src/main/assets/app.html
          grep -q 'insertRateDot' mbbuild/app/src/main/assets/app.js

      - name: Increase Gradle build memory
        run: |
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.workers.max=1\n' >> mbbuild/gradle.properties

      - name: Build debug APK
        run: gradle -p mbbuild :app:assembleDebug --stacktrace --no-daemon --max-workers=1

      - name: Re-sign APK with Firebase-registered stable key
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found"
            exit 1
          fi
          "$APKSIGNER" sign \
            --ks .mb-signing/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out MB-Diamond-Diary-v3.1.7-final.apk \
            mbbuild/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose --print-certs MB-Diamond-Diary-v3.1.7-final.apk | tee signing-verify.txt
          grep -qi 'ee5144e1dc33c02cf65939ec78948c37328a1daf' signing-verify.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v3.1.7-final
          path: MB-Diamond-Diary-v3.1.7-final.apk
