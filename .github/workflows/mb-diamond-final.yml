name: Build MB Diamond Diary Final APK

on:
  push:
    branches:
      - mb-diamond-diary-v3.1-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: .mb-signing/debug.keystore
          key: mb-diamond-diary-debug-signing-v1

      - name: Create stable debug signing key once
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .mb-signing
          keytool -genkeypair -v \
            -keystore .mb-signing/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Install stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          cp .mb-signing/debug.keystore "$HOME/.android/debug.keystore"
          keytool -list -v -keystore .mb-signing/debug.keystore -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA256:'

      - name: Restore source
        run: |
          cat mbparts/part-00 mbparts/part-01 mbparts/part-02 mbparts/part-03 mbparts/part-04 mbparts/part-05a mbparts/part-05b mbparts/part-05c > source.b64
          base64 -d source.b64 > source.zip
          mkdir mbbuild
          unzip -q source.zip -d mbbuild

      - name: Apply v3.1.3 dashboard + decimal fixes
        run: python tools/mb_patch_v313.py mbbuild

      - name: Increase Gradle build memory
        run: |
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.workers.max=1\n' >> mbbuild/gradle.properties

      - name: Build debug APK
        run: gradle -p mbbuild :app:assembleDebug --stacktrace --no-daemon --max-workers=1

      - name: Rename APK
        run: cp mbbuild/app/build/outputs/apk/debug/app-debug.apk MB-Diamond-Diary-v3.1.4-stable-login.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v3.1.4-stable-login
          path: MB-Diamond-Diary-v3.1.4-stable-login.apk
