name: Package MB Diamond Diary v3.2.5 Source

on:
  push:
    branches:
      - mb-diamond-diary-v3.1-build
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          cat mbparts/part-00 mbparts/part-01 mbparts/part-02 mbparts/part-03 mbparts/part-04 mbparts/part-05a mbparts/part-05b mbparts/part-05c > source.b64
          base64 -d source.b64 > source.zip
          mkdir mbbuild
          unzip -q source.zip -d mbbuild
      - name: Apply patches through v3.2.5
        run: |
          python tools/mb_patch_v313.py mbbuild
          python tools/mb_patch_v316.py mbbuild
          python tools/mb_patch_v317.py mbbuild
          python tools/mb_patch_v318.py mbbuild
          python tools/mb_patch_v319.py mbbuild
          python tools/mb_patch_v320.py mbbuild
          python tools/mb_patch_v322.py mbbuild
          python tools/mb_patch_v323.py mbbuild
          python tools/mb_patch_v324.py mbbuild
          python tools/mb_patch_v325.py mbbuild
          python tools/mb_patch_v326.py mbbuild
      - name: Verify v3.2.5 source
        run: |
          grep -q "versionName '3.2.5'" mbbuild/app/build.gradle
          grep -q 'snapshotCompanyId.length() == 0' mbbuild/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -q 'class="rate-dot"' mbbuild/app/src/main/assets/app.html
          grep -q 'id="hourRateDot"' mbbuild/app/src/main/assets/app.html
          grep -q 'id="hourValueDot"' mbbuild/app/src/main/assets/app.html
      - name: Package source
        run: |
          cd mbbuild
          zip -qr ../MB-Diamond-Diary-v3.2.5-source.zip .
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v3.2.5-source
          path: MB-Diamond-Diary-v3.2.5-source.zip
