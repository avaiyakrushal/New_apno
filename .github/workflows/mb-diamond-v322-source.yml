name: Package MB Diamond Diary v3.2.9 Source

on:
  push:
    branches:
      - mb-diamond-diary-v3.1-build
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          cat mbparts/part-00 mbparts/part-01 mbparts/part-02 mbparts/part-03 mbparts/part-04 mbparts/part-05a mbparts/part-05b mbparts/part-05c > source.b64
          base64 -d source.b64 > source.zip
          mkdir mbbuild
          unzip -q source.zip -d mbbuild
      - name: Apply patches through v3.2.9
        run: |
          python tools/mb_patch_v313.py mbbuild
          python tools/mb_patch_v316.py mbbuild
          python tools/mb_patch_v317.py mbbuild
          python tools/mb_patch_v318.py mbbuild
          python tools/mb_patch_v319.py mbbuild
          python tools/mb_patch_v320.py mbbuild
          python tools/mb_patch_v322.py mbbuild
          python tools/mb_patch_v323.py mbbuild
          python tools/mb_patch_v324.py mbbuild
          python tools/mb_patch_v325.py mbbuild
          python tools/mb_patch_v326.py mbbuild
          python tools/mb_patch_v327.py mbbuild
          python tools/mb_patch_v328.py mbbuild
          python tools/mb_patch_v329.py mbbuild
          python tools/mb_patch_v330.py mbbuild
          python tools/mb_patch_v331.py mbbuild
      - name: Verify v3.2.9 source
        run: |
          grep -q "versionName '3.2.8'" mbbuild/app/build.gradle
          grep -q 'mirrorWorkerMembership' mbbuild/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -q 'collection("members")' mbbuild/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -q 'loadBossWorkersFromUsers' mbbuild/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -q 'watchWorkerNoticeSubcollections' mbbuild/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -q 'final String sharedText = clean' mbbuild/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -q 'repairWorkerFromLocalMembership' mbbuild/app/src/main/java/com/example/diamonddiary/MainActivity.java
          grep -q 'localMembershipWins' mbbuild/app/src/main/java/com/example/diamonddiary/MainActivity.java
      - name: Package source
        run: |
          cd mbbuild
          zip -qr ../MB-Diamond-Diary-v3.2.9-source.zip .
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v3.2.9-source
          path: MB-Diamond-Diary-v3.2.9-source.zip
