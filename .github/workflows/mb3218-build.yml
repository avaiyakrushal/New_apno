      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle -p project :app:assembleRelease --stacktrace

      - name: Align APK for modern Android and package source
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -P 16 -f -v 4             project/app/build/outputs/apk/release/app-release-unsigned.apk             MB-Diamond-Diary-v3.2.18-aligned-unsigned.apk
          "$BT/zipalign" -c -P 16 -v 4 MB-Diamond-Diary-v3.2.18-aligned-unsigned.apk
          (cd project && zip -qr ../MB-Diamond-Diary-v3.2.18-source.zip .)
          mkdir -p android-sign-tools/lib
          cp "$BT/apksigner" android-sign-tools/
          cp "$BT/lib/apksigner.jar" android-sign-tools/lib/

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: MB-Diamond-Diary-v3.2.18-build
          path: |
            MB-Diamond-Diary-v3.2.18-aligned-unsigned.apk
            MB-Diamond-Diary-v3.2.18-source.zip
            android-sign-tools
