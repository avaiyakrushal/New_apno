            Bundle extras = intent.getExtras();
            String text = safe(extras.getString("text"));
            if (text.length() == 0) text = safe(extras.getString("body"));
            String noticeId = safe(extras.getString("noticeId"));
            if (noticeId.length() == 0) noticeId = safe(extras.getString("id"));
