name: Build MB Diamond Diary v3.2.18
on:
  push:
    branches: [mb-diamond-diary-v3.2.18-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct v3.2.17 source
        run: |
          cat mb-build/part*.txt | base64 -d > mb-source.zip
          mkdir -p project
          unzip -q mb-source.zip -d project

      - name: Apply v3.2.18 one-shot fixes
